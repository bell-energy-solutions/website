# Publishes the site when a change is merged into main.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          FORM_ACCESS_KEY: ${{ secrets.FORM_ACCESS_KEY }}
      - name: Check pages and links
        run: npm run check:html
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tell search engines (Bing and other IndexNow partners) the site changed.
      # Skipped until the real domain serves the key file (Phase 6).
      - name: IndexNow ping
        run: |
          site="https://bellenergysolutions.com"
          key_file=$(ls public/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -n1)
          key=$(basename "$key_file" .txt)
          if [ "$(curl -fsS "$site/$key.txt" 2>/dev/null)" != "$key" ]; then
            echo "Domain not serving the IndexNow key yet; skipping."
            exit 0
          fi
          urls=$(grep -oE '<loc>[^<]+</loc>' dist/sitemap-0.xml | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          jq -n --arg host "bellenergysolutions.com" --arg key "$key" --arg loc "$site/$key.txt" --argjson urls "$urls" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d @- \
            && echo "IndexNow ping sent" || echo "IndexNow ping failed (not fatal)"
